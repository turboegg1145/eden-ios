name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-linux

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        # Real-asset tests skip themselves when the private .paz data is not
        # present; the synthetic and parser/VM/render tests always run.
        run: cargo test --workspace -- --test-threads=2
