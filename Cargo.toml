[workspace]
resolver = "2"
members = [
    "crates/eden-paz",
    "crates/eden-script",
    "crates/eden-render",
    "crates/eden-audio",
    "crates/eden-app",
    "crates/eden-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["eden-rs contributors"]

[workspace.dependencies]
encoding_rs = "0.8.35"
png = "0.18.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
fontdue = "0.9.3"
lewton = "0.10.2"
glow = "0.16"
bytemuck = { version = "1.21", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
